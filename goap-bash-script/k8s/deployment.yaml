apiVersion: apps/v1
kind: Deployment
metadata:
  name: goap-bash-script
  labels:
    app: goap-bash-script
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goap-bash-script
  template:
    metadata:
      labels:
        app: goap-bash-script
    spec:
      containers:
        - name: goap-bash-script
          image: goap-bash-script:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: goap-bash-script-secrets
                optional: true
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"
