apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-helper
  labels:
    app: travel-helper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travel-helper
  template:
    metadata:
      labels:
        app: travel-helper
    spec:
      containers:
        - name: travel-helper
          image: travel-helper:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: travel-helper-secrets
                optional: true
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"
