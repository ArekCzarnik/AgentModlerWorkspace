apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetch-api
  labels:
    app: fetch-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fetch-api
  template:
    metadata:
      labels:
        app: fetch-api
    spec:
      containers:
        - name: fetch-api
          image: fetch-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: fetch-api-secrets
                optional: true
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"
